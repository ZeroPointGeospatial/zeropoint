---
layout: default
---
{%- include root.html -%}
<article class="post">
  <header class="page-head band band--ink">
    <div class="wrap wrap--narrow">
      <p class="label"><a href="{{ root }}blog/">Field notes</a> <span class="sep">/</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
      <h1 class="page-head__title page-head__title--post">{{ page.title }}</h1>
    </div>
  </header>
  <div class="band band--paper">
    <div class="wrap wrap--narrow prose">
      {{ content }}
    </div>
    <aside class="wrap wrap--narrow post__cta">
      <div>
        <p class="label">Need this on your own site?</p>
        <p>Tell us where the land is and what you need to know. We reply within two hours on business days.</p>
      </div>
      <a class="btn btn--dark" href="{{ root }}#contact">Request a survey quote</a>
    </aside>
  </div>
</article>
