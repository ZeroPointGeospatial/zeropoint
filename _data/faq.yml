- q: What information do I need for a quote?
  a: Share the project location, land size, service type, urgency, and any existing plans or coordinates.
- q: What deliverables can I request?
  a: PDF maps, CAD drawings, coordinate tables, survey reports, GIS layers or topographic data.
- q: Do you work outside Nairobi?
  a: Yes. We can discuss survey work across Kenya depending on project scope and timelines.
- q: How much does a survey cost?
  a: Pricing depends on land size, terrain and the deliverable you need. We send a clear quote within two hours on business days.
- q: How do I verify land beacons?
  a: Request a boundary verification survey. We locate the beacons and provide a signed report confirming how the parcel aligns.
