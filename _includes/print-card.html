{%- assign p = include.print -%}
<a class="print-card" href="{{ root }}prints/{{ p.slug }}/" data-series="{{ p.series }}">
  <span class="print-card__wall"><span class="frame">{% include print-img.html print=p lazy=true %}</span></span>
  <span class="print-card__meta"><span>{{ p.plate_label | default: 'Plate' }} {{ p.plate }}</span><span>{{ p.series }}</span></span>
  <h3>{{ p.short | default: p.title }}</h3>
  <p>{{ p.theme }}</p>
  {%- include price-range.html series=p.series %}
  <span class="print-card__price">From KSh {% include ksh.html n=pr_lo %}</span>
</a>
