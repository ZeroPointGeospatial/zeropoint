{%- comment -%}
  The quote form. Posts to Formspree; js/site.js sends it without leaving the page.
    {% include quote-form.html client="Developers" %}   client is sent with the request
{%- endcomment -%}
{%- assign c = site.data.contact -%}
    <form class="form" id="quote-form" data-ajax action="{{ c.form_action }}" method="POST">
      <input type="hidden" name="_subject" value="New Survey Quote Request{% if include.client %}: {{ include.client }}{% endif %}">
      {%- if include.client %}
      <input type="hidden" name="client_type" value="{{ include.client }}">
      {%- endif %}
      <div class="form__grid">
        <div class="field"><label for="fname">First name</label><input id="fname" name="firstname" type="text" autocomplete="given-name" required></div>
        <div class="field"><label for="lname">Last name</label><input id="lname" name="lastname" type="text" autocomplete="family-name" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="phone">Phone or WhatsApp</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+254 7XX XXX XXX" required></div>
        <div class="field"><label for="location">Project location</label><input id="location" name="location" type="text" placeholder="Town, estate or county" required></div>
        <div class="field"><label for="size">Land or site size</label><input id="size" name="size" type="text" placeholder="e.g. 1 acre, 500 m road"></div>
        <div class="field">
          <label for="service">Service needed</label>
          <select id="service" name="service" required>
            <option value="">Select a service</option>
            {%- for s in site.data.services %}
            <option>{{ s.name }}</option>
            {%- endfor %}
          </select>
        </div>
        <div class="field">
          <label for="timeline">Timeline</label>
          <select id="timeline" name="timeline" required>
            <option value="">Select a timeline</option>
            <option>Urgent, this week</option>
            <option>1 to 2 weeks</option>
            <option>This month</option>
            <option>Flexible</option>
          </select>
        </div>
        <div class="field field--wide"><label for="notes">Anything else we should know <span class="muted">(optional)</span></label><textarea id="notes" name="notes" rows="3"></textarea></div>
      </div>
      <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <button class="btn btn--dark" type="submit">Request quote</button>
      <p class="form__status" role="status" aria-live="polite"></p>
    </form>
