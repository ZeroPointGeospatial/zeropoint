# Plate 18: Lake Baringo and Lake Bogoria, the rising Rift lakes.
# The GLO-30 terrain painted with the JRC Global Surface Water transitions
# (surfacewater.py): water at the start of the Landsat record and in 2021 in
# deep blue, land that had become water by 2021 in coral.
#
#   python relief.py spec:maps/baringo-bogoria-water.yml 100 16    # proof
#   python relief.py spec:maps/baringo-bogoria-water.yml 300 40    # master
#
# The lake areas in the facts row are measured by surfacewater.py from the
# data on every run. Names and positions: OpenStreetMap, read through Overture
# Maps (release 2026-11-18): towns and villages from the divisions theme, the
# lakes and Ol Kokwe from the base theme; the Tugen Hills name sits at OSM's
# point for the range.
