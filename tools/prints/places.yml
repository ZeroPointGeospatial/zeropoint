# Landmarks that first_look.py finds by name, and the area a first look draws
# for each. Kenyan counties, countries, towns and named peaks are found
# without this list (the county boundaries and Natural Earth); this list is
# for hills, mountains, craters, lakes, valleys and parks.
#
#   name      what the customer is likely to write; matching ignores case,
#             spaces and punctuation, and allows small typos
#   aliases   other ways of writing it
#   kind      mountain, hills, crater, lake, valley, park, escarpment or town
#   bbox      [west, south, east, north] in degrees: the area a draft draws.
#             These are generous first guesses; tighten them in the draft spec.
#   centre    [lon, lat] for a town (a gold city print needs a centre and a
#             radius_km)
#   labels    point labels for the draft. Heights are copied from the shop's
#             plates (relief.py, contours.py) and the sources noted there;
#             add a height only from a source you can name.
#   names     italic area names for the draft
#
# Add a place by copying an entry. Keep the list to places people ask for.

