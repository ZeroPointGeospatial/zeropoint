name: Fix Prints card alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  align-print-card-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Align frame controls and order buttons
        shell: bash
        run: |
          set -e
          FILE="css/prints-shop.css"
          MARKER="/* FIX: aligned print card controls */"

          if grep -q "$MARKER" "$FILE"; then
            echo "Alignment fix already present."
            exit 0
          fi

          cat >> "$FILE" <<'CSS'

/* FIX: aligned print card controls */
/* Keep the frame/finish row at one consistent level across every card in a grid row. */
.print-card-body{
  min-height:0;
}
.print-frames{
  min-height:30px;
  margin-top:auto !important;
  margin-bottom:1.2rem !important;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  align-content:center;
  gap:.65rem;
  padding-top:.9rem;
  border-top:1px solid #e1e3de;
}
.print-order-btn{
  margin-top:0 !important;
  flex:0 0 auto;
}
@media(max-width:480px){
  .print-frames{gap:.5rem;min-height:30px}
}
CSS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Fix print card control alignment"
          git push
