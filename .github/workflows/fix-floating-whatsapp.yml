name: Fix floating WhatsApp styling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply shared WhatsApp styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('css/site.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* ZP FLOATING WHATSAPP — SHARED FINAL STYLE */'

          if marker in text:
              print('WhatsApp fix already present; nothing to do.')
              raise SystemExit(0)

          css = r'''

          /* ZP FLOATING WHATSAPP — SHARED FINAL STYLE */
          .whatsapp-btn,
          a.whatsapp-btn,
          button.whatsapp-btn {
            position: fixed !important;
            right: 20px !important;
            bottom: 20px !important;
            z-index: 10000 !important;
            width: 58px !important;
            height: 58px !important;
            min-width: 58px !important;
            min-height: 58px !important;
            padding: 0 !important;
            margin: 0 !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            box-sizing: border-box !important;
            border-radius: 50% !important;
            background: #25D366 !important;
            color: #fff !important;
            border: 2px solid rgba(255,255,255,.95) !important;
            box-shadow: 0 6px 18px rgba(0,0,0,.20) !important;
            opacity: 1 !important;
            visibility: visible !important;
            text-decoration: none !important;
            overflow: visible !important;
          }

          .whatsapp-btn:hover,
          a.whatsapp-btn:hover,
          button.whatsapp-btn:hover {
            background: #20bd5a !important;
            color: #fff !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 9px 22px rgba(0,0,0,.24) !important;
          }

          .whatsapp-btn svg,
          a.whatsapp-btn svg,
          button.whatsapp-btn svg {
            width: 29px !important;
            height: 29px !important;
            min-width: 29px !important;
            min-height: 29px !important;
            display: block !important;
            flex: 0 0 29px !important;
            fill: #fff !important;
            color: #fff !important;
            stroke: #fff !important;
          }

          .whatsapp-btn svg *,
          a.whatsapp-btn svg *,
          button.whatsapp-btn svg * {
            fill: #fff !important;
            color: #fff !important;
            stroke: #fff !important;
          }

          @media (max-width: 800px) {
            .whatsapp-btn,
            a.whatsapp-btn,
            button.whatsapp-btn {
              right: 16px !important;
              bottom: 78px !important;
              width: 56px !important;
              height: 56px !important;
              min-width: 56px !important;
              min-height: 56px !important;
            }
          }
          '''

          path.write_text(text.rstrip() + css + '\n', encoding='utf-8')
          print('Applied shared WhatsApp styling.')
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- css/site.css; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/site.css
          git commit -m 'fix: shared floating WhatsApp appearance'
          git push
